# Data sources. Every source records when its data became public
# (published_at) so the model can be run "as of" any past date without
# seeing data that didn't exist yet. All sources are official or open.
#
# published_at rules:
#   fixed      - one date for the whole release (e.g. a Census)
#   per_record - each row carries its own date (e.g. monthly patronage + lag)
#   snapshot   - the date the snapshot describes (e.g. OSM state on a date)
#   fetched    - the date we downloaded it (no history available)

abs_census_gcp:
  title: ABS Census 2021 General Community Profile (SA1, NSW)
  provider: Australian Bureau of Statistics
  licence: CC BY 4.0
  url: https://www.abs.gov.au/census/find-census-data/datapacks/download/2021_GCP_SA1_for_NSW_short-header.zip
  size_mb: 125
  published_at: {rule: fixed, date: 2022-06-28}      # Census first release
  valid_from: 2021-08-10                              # Census night
  used_for: residents, age, income, household and dwelling mix

abs_census_wpp:
  title: ABS Census 2021 Working Population Profile (SA2, NSW)
  provider: Australian Bureau of Statistics
  licence: CC BY 4.0
  # Finest geography published as a DataPack is SA2; the pipeline spreads
  # workers onto commercial/industrial/education/health mesh blocks.
  url: https://www.abs.gov.au/census/find-census-data/datapacks/download/2021_WPP_SA2_for_NSW_short-header.zip
  size_mb: 10
  published_at: {rule: fixed, date: 2022-10-12}      # Census second release (employment)
  valid_from: 2021-08-10
  used_for: workers by place of work
  # Relative jobs per km2 by mesh-block land use, used to spread each SA2's
  # workers within the SA2 (assumption: offices/shops/hospitals densest).
  mesh_block_job_density:
    Commercial: 1.0
    Hospital/Medical: 1.0
    Education: 0.6
    Industrial: 0.35
    Transport: 0.15
    Other: 0.1
    Residential: 0.02
    Parkland: 0.0
    Water: 0.0
    Primary Production: 0.01

abs_boundaries:
  title: ABS ASGS Edition 3 boundaries (SA1, SA2, mesh blocks, LGA)
  provider: Australian Bureau of Statistics
  licence: CC BY 4.0
  url: https://geo.abs.gov.au/arcgis/rest/services/ASGS2021
  published_at: {rule: fixed, date: 2021-07-20}
  valid_from: 2021-07-01
  used_for: geometry for Census areas; mesh-block land-use category

tfnsw_station_usage:
  title: Train, Metro and Light Rail Station Entries and Exits (monthly)
  provider: Transport for NSW Open Data Hub
  licence: CC BY 4.0
  dataset: https://opendata.transport.nsw.gov.au/dataset/train-station-entries-and-exits-data
  resources:
    - https://opendata.transport.nsw.gov.au/data/dataset/3977df59-a1fa-422e-91ff-cfaeac355cc9/resource/0292414e-8f70-4ee3-a61b-c9749182fe6f/download/monthly_usage_pattern_train_data-june-2024.csv
    - https://opendata.transport.nsw.gov.au/data/dataset/3977df59-a1fa-422e-91ff-cfaeac355cc9/resource/c0396b43-8b5f-4243-b49d-ed9fc813005b/download/train-station-entries-and-exits-data-from-july-2024-to-oct-2024.csv
    - https://opendata.transport.nsw.gov.au/data/dataset/3977df59-a1fa-422e-91ff-cfaeac355cc9/resource/f8bb2918-0540-4bb3-9ccf-f7aef04d4249/download/entry_exit.csv
  size_mb: 4
  published_at: {rule: per_record, lag_days: 45}     # month end + typical publication lag
  used_for: commuter foot traffic at stations
  needs_key: false

osm:
  title: OpenStreetMap (via Overpass API)
  provider: OpenStreetMap contributors
  licence: ODbL 1.0
  # Tried in order. Historical ([date:]) queries are heavy; the main instance
  # often times out under load, so a mirror that serves them goes first.
  endpoints:
    - https://maps.mail.ru/osm/tools/overpass/api/interpreter
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  # Overpass can return the map exactly as it was on a past date ([date:...]),
  # so competitor sets are genuinely historical. Caveat: OSM was less complete
  # in earlier years, so older snapshots slightly undercount competitors.
  published_at: {rule: snapshot}
  used_for: competitors, anchor tenants, stations, schools; backtest cohort discovery
  min_seconds_between_requests: 5
  # Snapshot dates fetched: every N months from start, plus today. Public
  # Overpass servers are often overloaded, so dates are fetched in priority
  # order (today, then the backtest window, then the rest, newest first) and a
  # second pass retries failures. Re-run `python run.py data --only osm` to fill
  # any gaps; cached snapshots are never re-downloaded.
  snapshots: {start: 2019-01-01, every_months: 3, priority_window: [2022-07-01, 2025-03-01]}
  retry_cooldown_seconds: 90

osm_history:
  title: OpenStreetMap element history (OSM API v0.6)
  provider: OpenStreetMap contributors
  licence: ODbL 1.0
  url: https://api.openstreetmap.org/api/0.6/{element}/history.json
  # Every version of every element that was ever one of these business types
  # (their main competitor tag, e.g. amenity=cafe) in any snapshot. Each edit is
  # dated, so we learn when a business closed and what it became (another café,
  # vacant, another use, or deleted). One small request per element, cached.
  business_types: [cafe]
  min_seconds_between_requests: 0.3
  # Histories gain new versions over time: re-fetch cached ones older than this.
  cache_days: 14
  published_at: {rule: per_record}                    # each edit's timestamp
  used_for: backtest outcomes (closure dates, what replaced a business, site churn)
  needs_key: false

planning_da:
  title: NSW Planning Portal - Online DA data
  provider: NSW Department of Planning, Housing and Infrastructure
  licence: CC BY 4.0
  url: https://api.apps1.nsw.gov.au/eplanning/data/v0/OnlineDA
  published_at: {rule: per_record}                    # lodgement / determination dates
  used_for: approved developments adding future residents
  needs_key: false

google_places:
  title: Google Places API (New)
  provider: Google Maps Platform
  licence: Google Maps Platform Terms (limited caching; place IDs may be stored)
  url: https://places.googleapis.com/v1/places:searchText
  published_at: {rule: fetched}
  # Ground truth for backtests only. Never a model input, because ratings and
  # review counts are only available as of today (that would leak the outcome).
  used_for: backtest outcome proxies (rating, review count, business status)
  needs_key: true
  env_key: GOOGLE_PLACES_API_KEY
  # One Text Search per mapped business (cafes, gyms, childcare seen since
  # 2022, so closures are covered). Billed by Google per request; this caps it.
  max_requests: 400
  # Google's terms limit storing Places content: cached answers older than
  # this are fetched again rather than kept.
  cache_days: 30
  track_from: 2022-01-01

overture_places:
  title: Overture Maps Places
  provider: Overture Maps Foundation (Meta, Microsoft, Foursquare, AllThePlaces and others)
  licence: CDLA Permissive 2.0 / ODbL by source (see docs.overturemaps.org)
  catalog: https://stac.overturemaps.org/catalog.json
  s3: s3://overturemaps-us-west-2/release/{release}/theme=places/type=place/*
  # Outcome data (status as of the latest monthly release); never a model input.
  published_at: {rule: snapshot}
  used_for: backtest outcomes (is the business still listed, with what confidence)

foursquare_places:
  title: Foursquare Open Source Places
  provider: Foursquare
  licence: Apache 2.0 (attribution; NOTICE.txt)
  # Public mirror (no signup, but its newest release is Feb 2025). With HF_TOKEN
  # set (free Hugging Face account, accept the dataset terms), the latest
  # release is read from Hugging Face instead.
  public_listing: https://data.source.coop/fused/fsq-os-places/
  hf_dataset: foursquare/fsq-os-places
  published_at: {rule: snapshot}
  used_for: backtest outcomes (date added, last refreshed, date closed)

asic_business_names:
  title: ASIC Business Names Register
  provider: Australian Securities and Investments Commission (data.gov.au)
  licence: CC BY 3.0 AU
  # The ZIP is renamed each month, so its link is looked up in the catalogue.
  package_api: https://data.gov.au/data/api/3/action/package_show?id=asic-business-names
  dataset: https://data.gov.au/data/dataset/asic-business-names
  size_mb: 72
  # Current extract: every registered name plus names deregistered in the last
  # 12 months. No addresses, so only exact names registered around a business's
  # opening date are trusted (see config/backtest.yaml).
  published_at: {rule: fetched}
  used_for: backtest outcomes (business name still registered or cancelled)

geocoding:
  title: Address search
  provider: NSW Spatial Services, fallback OpenStreetMap Nominatim
  licence: CC BY 4.0 (NSW Spatial Services); ODbL 1.0 (Nominatim)
  url: https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Geocoded_Addressing_Theme/FeatureServer
  fallback_url: https://nominatim.openstreetmap.org/search
  published_at: {rule: fetched}
  used_for: turning typed addresses into coordinates
