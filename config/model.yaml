# Global model assumptions shared by all business types.
# Business-specific numbers (spend, profile weights, seasonality...) live in
# business_types/<id>.yaml. Every number the model uses is in one of these files.

horizon_months: 36

# --- Distance --------------------------------------------------------------
distance:
  # Straight-line distance x detour factor ~ walking distance on a street grid.
  # 1.3 is a common urban average; the OSM walking network is a planned upgrade.
  detour_factor: 1.3
  walk_speed_kmh: 4.8
  # Distances below this count as this. Demand points stand for areas a few
  # hundred metres across, so the model shouldn't distinguish 40 m from 90 m
  # (and co-located points mustn't produce infinite attraction).
  min_distance_m: 100
  # Soft catchment edge: people count fully up to (1 - fade) x the walk limit
  # and fade linearly to zero at (1 + fade) x. Avoids revenue jumping when a pin
  # moves a few metres past a station.
  catchment_fade: 0.2

# --- Layer 1: demand -------------------------------------------------------
demand:
  # Station patronage -> people: a regular commuter exits a given station
  # about this many times a month (weekday trips, some days off).
  commuter_trips_per_month: 20
  # Average patronage over the most recent N published months.
  station_usage_window_months: 12

# --- Layer 3: Huff gravity model -------------------------------------------
# P(customer at i picks store j) = A_j^alpha * d_ij^-beta / sum_k(A_k^alpha * d_ik^-beta)
huff:
  alpha: 1.0          # how much store attractiveness matters
  beta: 2.0           # distance decay; higher = customers stick closer to where they are
  # "Somewhere else" option (a store outside the modelled set, or doing without).
  # Behaves like a store with this attractiveness at this distance from everyone.
  outside_option:
    attractiveness: 1.0
    distance_m: 350

# Attractiveness of a competitor we know nothing about beyond location
# (multiplied by the profile's per-category weight). Chains get a small
# brand-awareness premium.
competitor_attractiveness:
  default: 1.0
  chain: 1.15

# --- Layer 4: agent-based simulation ----------------------------------------
# Virtual customers = (demand point, customer type) pairs. Agents choose among
# nearby stores and "elsewhere" with logit probabilities from
#   utility = alpha*log(attractiveness) - beta*m_dist*log(distance)
#             - elasticity*m_price*log(price / reference price)
#             + quality*m_quality*quality
# The first two terms are exactly the Huff model; the rest is what agents add.
# Month by month: awareness of the new store grows along the profile's ramp
# curve, and out of habit only some customers reconsider where they go each
# month (the rest repeat last month), so the ramp-up emerges from the simulation.
abm:
  enabled: true
  n_agents: 4000            # target; every demand point gets the same set of customer types
  seed: 42
  competitor_radius_m: 2000 # stores beyond this from the site barely matter to walkers
  utility:
    quality: 0.9            # per 1 sd of quality advantage (profile our_store.quality)
  heterogeneity_sigma: 0.35 # agents' distance/price/quality weights vary lognormally
  # Habit: share of customers who reconsider where they go in a given month.
  monthly_reconsider_share: 0.5

# --- Layer 5: competitor price response (game theory) -----------------------
# Incumbents' marginal costs are backed out from today's prices assuming they're
# already optimal (logit first-order condition). When we open, every player
# within radius_m re-optimises; rounds repeat until no price moves > tolerance.
game:
  enabled: true
  radius_m: 800             # competitors within this distance respond to our opening
  # false: our price stays at the profile's our_price (a business decision) and the
  # model reports the price it would suggest; true: the model sets it.
  optimise_our_price: false
  max_rounds: 60
  tolerance: 0.005          # $ (in reference-item price units)
  damping: 0.5              # each round moves prices this far toward the best response

# --- Layer 8: Monte Carlo ----------------------------------------------------
# Each run samples every parameter below; P10/P50/P90 come from the spread.
# All candidate sites see the same draws, so "chance this site is best" is fair.
# Paths: profile.* = active business profile, model.* = this file.
# Distributions: normal_rel (sd as fraction of base value), uniform, triangular.
# mode: fast  re-applies each draw to the base run's layer factors (exact at the
#             central values; the price game is re-solved on an elasticity grid)
#       full  re-runs the whole model per draw (slow; for validation)
montecarlo:
  n_runs: 300
  seed: 7
  mode: fast
  percentiles: [10, 50, 90]
  parameters:
    profile.spend.avg_transaction_value: {dist: normal_rel, sd: 0.10}
    profile.segments.*.participation:    {dist: normal_rel, sd: 0.20}
    profile.segments.*.visits_per_month: {dist: normal_rel, sd: 0.15}
    profile.dynamics.ramp_months_to_90pct: {dist: triangular, low: 4, mode: 8, high: 15}
    model.huff.beta:                     {dist: uniform, low: 1.5, high: 2.6}
    model.huff.outside_option.distance_m: {dist: uniform, low: 250, high: 500}
    profile.pricing.price_elasticity:    {dist: normal_rel, sd: 0.15}
    model.abm.monthly_reconsider_share:  {dist: uniform, low: 0.3, high: 0.7}

# --- Future demand from approved developments --------------------------------
developments:
  persons_per_new_dwelling: 2.4      # ABS 2021 average household size, Greater Sydney ~2.7; apartments lower
  # The Planning Portal reports "Determined" without the outcome. Most determined
  # DAs are approved, so their dwellings count at this rate (assumption).
  determined_approval_rate: 0.9
  # Months from DA approval to occupation, by project size (new dwellings).
  build_months:
    - {max_dwellings: 10,  months: 18}
    - {max_dwellings: 100, months: 30}
    - {max_dwellings: 100000, months: 42}
  occupancy_ramp_months: 6           # new buildings fill up gradually

# --- Finding the best spots in an area ------------------------------------------
# The user draws a circle; candidates are vacant shopfronts in it, or a grid over
# it. Every candidate gets a quick score (demand x fit x anchors x Huff share:
# ~2 ms each), the best `shortlist` (kept at least min_separation_m apart, so
# suggestions don't pile onto one corner) are re-run with the full model over
# 36 months, and the top `results` get Monte Carlo ranges.
search:
  max_radius_m: 3000
  grid_points: 900            # grid spacing adapts to the circle's size...
  min_spacing_m: 60           # ...but never denser than this
  retail_within_m: 150        # "only where similar businesses trade": near a mapped competitor
  # In three test areas the full model's top 5 were always the quick score's top 5
  # (Spearman 0.88-0.99), so 12 leaves a wide margin at a quarter of the cost of 50.
  shortlist: 12
  min_separation_m: 150
  results: 5
