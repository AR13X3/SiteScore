name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sitescore tests run.py
      - name: Test (mock data, no API keys)
        run: pytest

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Demo container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build the image the live demo runs
        run: docker build -t sitescore .
      - name: Start it and check it answers
        run: |
          docker run -d --name app -p 7860:7860 -e SITESCORE_WARM_EVIDENCE=0 sitescore
          for i in $(seq 1 60); do curl -fsS localhost:7860/api/health && break; sleep 2; done
          curl -fsS localhost:7860/ | grep -q 'id="root"'
          curl -fsS localhost:7860/api/analyst/status | tee /dev/stderr | grep -q '"mode":"replay"'
          curl -fsS -X POST localhost:7860/api/simulate -H 'Content-Type: application/json' \
            -d '{"business_type":"cafe","sites":[{"id":"a","label":"a","lat":-33.815,"lon":151.0035}]}' | grep -q total_revenue
          curl -fsS -N -X POST localhost:7860/api/analyst/chat -H 'Content-Type: application/json' \
            -d '{"question":"How accurate is SiteScore? Should I trust it?"}' | grep -q 'event: done'
      - name: Container log
        if: always()
        run: docker logs app 2>&1 | tail -40
