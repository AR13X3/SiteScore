name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python run.py start
        2. Open the Workspace and ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python and Node versions, browser
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
